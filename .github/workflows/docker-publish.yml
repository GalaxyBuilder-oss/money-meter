name: Build and Push Docker to GHCR

on:
  push:
    branches: [ "main" ] # Sesuaikan dengan branch utama Anda
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  # Otomatis mengambil nama repository dan mengubahnya menjadi huruf kecil (lowercase)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # <-- Ditambahkan agar mendeteksi Dockerfile di root folder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }} # Opsional, bisa disesuaikan jadi ${{ steps.meta.outputs.labels }}
