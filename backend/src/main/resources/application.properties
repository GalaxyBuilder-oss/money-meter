# rename application.properties(Sample) To application.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=${DB_DIALECT}
spring.application.name=Money Meter
spring.datasource.driverClassName=${DB_DRIVER}
spring.datasource.url=${STRING_URI_DB}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Agar Spring Boot tidak langsung error fatal jika database belum siap saat pertama nyala
spring.datasource.continue-on-error=true

# (Opsional untuk Spring Boot 3 / JPA) Menunda inisialisasi data SQL sampai datasource siap
spring.jpa.defer-datasource-initialization=true

# --- Konfigurasi Swagger UI / SpringDoc OpenAPI ---
# Mengubah path default UI Swagger (default-nya /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Path untuk file JSON OpenAPI dokumen
springdoc.api-docs.path=/v3/api-docs
# Mengaktifkan atau menonaktifkan Swagger (bisa diatur true/false via environment variable)
springdoc.swagger-ui.enabled=true
